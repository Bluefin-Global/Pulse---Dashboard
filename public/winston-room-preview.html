<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Winston Command — 3D architecture prototype</title><style>body{margin:0;background:#03070e;color:#bceeff;font:14px system-ui}canvas{display:block}header{position:fixed;top:20px;left:24px;right:24px;display:flex;align-items:center;gap:16px;z-index:2}button{background:#071827;color:#bceeff;border:1px solid #387a99;padding:10px 18px;cursor:pointer}small{position:fixed;bottom:18px;left:24px;color:#bceeff}#status{position:fixed;top:70px;left:24px}</style></head><body><header><strong>WINSTON COMMAND</strong><button id="command">COMMAND CENTER</button><button id="trade">TRADING DASHBOARD</button></header><div id="status">Initializing 3D renderer…</div><small>Isolated architectural prototype · No live data · Existing dashboard unchanged</small><script type="module">
import * as T from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
const status=document.getElementById('status');try{
const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.toneMapping=T.ACESFilmicToneMapping;document.body.append(renderer.domElement);
const scene=new T.Scene();scene.background=new T.Color(0x03060c);scene.fog=new T.FogExp2(0x03060c,.018);
const camera=new T.PerspectiveCamera(57,innerWidth/innerHeight,.1,100);camera.position.set(0,3.4,11);camera.lookAt(0,3,-3);
scene.add(new T.HemisphereLight(0x719ed0,0x090b13,1.8));
const metal=new T.MeshStandardMaterial({color:0x182332,metalness:.8,roughness:.32});const dark=new T.MeshStandardMaterial({color:0x080d15,metalness:.65,roughness:.25});
function mesh(g,m,x,y,z){const o=new T.Mesh(g,m);o.position.set(x,y,z);scene.add(o);return o;}
function ring(r,y,color){const o=mesh(new T.TorusGeometry(r,.035,12,180),new T.MeshBasicMaterial({color}),0,y,-2);o.rotation.x=Math.PI/2;return o;}
mesh(new T.CylinderGeometry(19,19,.3,96),dark,0,-.2,-2);mesh(new T.CylinderGeometry(2.3,2.6,.4,96),metal,0,.2,-2);ring(2.25,.43,0x25dfff);ring(3.4,.015,0xff365d);ring(8.8,.02,0xff5735);ring(10.8,7.1,0xff386a);ring(10.5,6.95,0x27aaff);
const wall=new T.Mesh(new T.CylinderGeometry(11,11,7,96,1,true,Math.PI*.17,Math.PI*1.66),new T.MeshStandardMaterial({color:0x101a29,side:T.BackSide,metalness:.7,roughness:.4}));wall.position.set(0,3.5,-2);scene.add(wall);
const screens=[];for(let i=0;i<13;i++){const a=(i-6)*.19;const x=10.6*Math.sin(a),z=-2-10.6*Math.cos(a);for(let j=0;j<2;j++){const frame=mesh(new T.BoxGeometry(1.94,2.48,.15),metal,x,1.8+j*2.65,z);frame.rotation.y=-a;const c=document.createElement('canvas');c.width=512;c.height=640;const ctx=c.getContext('2d');const texture=new T.CanvasTexture(c);texture.colorSpace=T.SRGBColorSpace;const panel=mesh(new T.PlaneGeometry(1.8,2.3),new T.MeshBasicMaterial({map:texture}),x-.10*Math.sin(a),1.8+j*2.65,z+.10*Math.cos(a));panel.rotation.y=-a;screens.push({ctx,texture,i,j});}}
const globe=new T.Group();scene.add(globe);globe.position.set(0,2.9,-2);const sphere=new T.Mesh(new T.SphereGeometry(1.8,64,48),new T.MeshBasicMaterial({color:0x093b68,transparent:true,opacity:.32}));globe.add(sphere);const vertices=[];for(let lat=-80;lat<=80;lat+=4){for(let lon=0;lon<360;lon+=4/Math.max(.2,Math.cos(lat*Math.PI/180))){const a=lat*Math.PI/180,b=lon*Math.PI/180;vertices.push(1.81*Math.cos(a)*Math.sin(b),1.81*Math.sin(a),1.81*Math.cos(a)*Math.cos(b));}}const g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(vertices,3));globe.add(new T.Points(g,new T.PointsMaterial({color:0x5bdcff,size:.027,transparent:true,opacity:.85})));
const network=new T.Group();globe.add(network);for(let i=0;i<8;i++){const a=i*Math.PI/4;const node=new T.Mesh(new T.SphereGeometry(.14,20,16),new T.MeshBasicMaterial({color:0x6dfaff}));node.position.set(2.3*Math.cos(a),.35*Math.sin(a*2),2.3*Math.sin(a));network.add(node);const line=new T.BufferGeometry().setFromPoints([new T.Vector3(),node.position]);network.add(new T.Line(line,new T.LineBasicMaterial({color:0x2a9bbf})));}network.visible=false;
function light(color,x,y,z,p){const l=new T.PointLight(color,p,25);l.position.set(x,y,z);scene.add(l);}light(0x00baff,0,3,-2,65);light(0xff3058,-7,5,-4,110);light(0x147aff,7,5,-4,110);
function mode(trade){network.visible=trade;for(const {ctx,texture,i,j} of screens){ctx.fillStyle='#06101e';ctx.fillRect(0,0,512,640);ctx.strokeStyle='#16374b';for(let y=80;y<620;y+=40){ctx.beginPath();ctx.moveTo(20,y);ctx.lineTo(492,y);ctx.stroke();}ctx.fillStyle='#8ceaff';ctx.font='bold 26px monospace';ctx.fillText((trade?['ACCOUNTS','FUTURES','ORDER FLOW','RISK']:['MARKETS','HEAT MAP','NEWS','ECONOMY'])[i%4],22,42);ctx.font='18px monospace';ctx.fillStyle='#6e8fa6';ctx.fillText('DATA NOT CONNECTED',22,90);texture.needsUpdate=true;}status.textContent=trade?'TRADING DASHBOARD · geometry prototype':'COMMAND CENTER · geometry prototype';}
document.getElementById('command').onclick=()=>mode(false);document.getElementById('trade').onclick=()=>mode(true);mode(false);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});renderer.setAnimationLoop(()=>{if(!matchMedia('(prefers-reduced-motion: reduce)').matches)globe.rotation.y+=.002;renderer.render(scene,camera);});
}catch(e){status.textContent='3D renderer unavailable: '+e.message;}
</script></body></html>
