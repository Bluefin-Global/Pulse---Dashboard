name: Winston screen verification
on:
  push:
    branches: [winston-recovery-functional-baseline]
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/winston-screens.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: winston-screen-evidence
          path: artifacts/screens/
