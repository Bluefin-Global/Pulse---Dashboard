name: Winston recovery checks
on:
  push:
    branches: [winston-recovery-functional-baseline]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/winston-recovery.test.cjs
