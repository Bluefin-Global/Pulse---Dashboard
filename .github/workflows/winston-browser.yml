name: Winston Command browser validation
on:
  push:
    branches:
      - winston-command-integration
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run browser validation and capture screenshots
        run: node tests/browser-smoke.cjs
      - name: Upload screenshots and browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winston-command-browser-preview
          path: artifacts/browser/
          if-no-files-found: warn
          retention-days: 14
